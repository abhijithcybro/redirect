<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening Mobo App…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fallback if JS is disabled or the script fails -->
  <meta http-equiv="refresh" content="6;url=https://www.cybrosys.com/mobo/#apps">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #4a45c8; }
  </style>
</head>
<body>

<p>Redirecting…<br><a id="manual" href="https://www.cybrosys.com/mobo/#apps">Tap here if nothing happens</a></p>

<script>
  const WEB_FALLBACK = "https://www.cybrosys.com/mobo/#apps";

  const APP_MAP = {
    fullsuite: {
      ios: "https://apps.apple.com/app/id6743953967",
      android: "https://play.google.com/store/apps/dev?id=7163004064816759344&hl=en_IN",
      web: WEB_FALLBACK
    }
  };

  const params = new URLSearchParams(window.location.search);
  // default to fullsuite so a bare link still lands somewhere useful
  const app = params.get('app') || 'fullsuite';

  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  const platform = navigator.platform || "";

  // iPadOS 13+ reports itself as a Mac, so check for touch support too
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Mac/.test(ua + platform) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

  const appData = APP_MAP[app];

  let target = WEB_FALLBACK;
  if (appData) {
    if (isIOS) target = appData.ios;
    else if (isAndroid) target = appData.android;
    else target = appData.web;
  }

  document.getElementById('manual').href = target;
  // replace() keeps this page out of history, so Back returns to the scanner/app
  window.location.replace(target);
</script>

</body>
</html>
